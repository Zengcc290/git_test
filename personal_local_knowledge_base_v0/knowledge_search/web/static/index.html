<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人知识库</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">KB</span>
      <div class="brand-text">
        <h1>个人知识库</h1>
        <p>本地 SQLite FTS5 · 关键词检索 · 带引用问答</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="search" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        搜索
      </button>
      <button class="tab" data-view="ask" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H5l2-3a8 8 0 1 1 14-5z"/></svg>
        问答
      </button>
      <button class="tab" data-view="import" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        导入
      </button>
      <button class="tab" data-view="manage" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        文档
      </button>
    </nav>
  </header>

  <main class="shell">
    <aside class="sidebar">
      <div class="stat-block">
        <div class="stat-row"><span>文档</span><strong id="stat-documents">—</strong></div>
        <div class="stat-row"><span>分段</span><strong id="stat-chunks">—</strong></div>
      </div>
      <div class="sidebar-note" id="sidebar-note">正在加载统计信息…</div>
    </aside>

    <section class="content">
      <div class="panel is-active" id="panel-search" role="tabpanel">
        <div class="panel-head">
          <h2>关键词搜索</h2>
          <p>在已索引文档中查找匹配内容，支持中文分词与命中高亮。</p>
        </div>
        <form id="search-form" class="search-form" autocomplete="off">
          <div class="field-row">
            <input id="search-q" type="text" placeholder="输入关键词，例如 SQLite 或 全文搜索" />
            <button type="submit" class="btn btn-primary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              搜索
            </button>
          </div>
        </form>
        <div class="results" id="search-results" aria-live="polite"></div>
      </div>

      <div class="panel" id="panel-ask" role="tabpanel" hidden>
        <div class="panel-head">
          <h2>文档问答</h2>
          <p>检索相关内容后交给大模型生成带引用的答案。未命中资料时会明确拒答。</p>
        </div>
        <form id="ask-form" autocomplete="off">
          <textarea id="ask-q" rows="4" placeholder="例如：SQLite FTS5 是什么？"></textarea>
          <div class="ask-options">
            <label class="option">
              <span>检索片段数</span>
              <input id="ask-topk" type="number" min="1" max="20" value="5" />
            </label>
            <label class="option">
              <span>上下文字符</span>
              <input id="ask-context" type="number" min="100" max="40000" step="100" value="12000" />
            </label>
            <label class="option">
              <span>温度</span>
              <input id="ask-temperature" type="number" min="0" max="2" step="0.1" value="0" />
            </label>
          </div>
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H5l2-3a8 8 0 1 1 14-5z"/></svg>
            生成答案
          </button>
        </form>
        <div class="answer" id="ask-result" aria-live="polite"></div>
      </div>

      <div class="panel" id="panel-import" role="tabpanel" hidden>
        <div class="panel-head">
          <h2>导入文档</h2>
          <p>上传 TXT、Markdown、PDF、PPTX 或 JSON 文件并立即索引。</p>
        </div>
        <form id="upload-form" class="upload-zone">
          <input id="upload-input" type="file" multiple accept=".txt,.md,.pdf,.pptx,.json" />
          <div class="upload-hint">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>
            <span>选择文件后自动上传并索引</span>
          </div>
        </form>
        <form id="dir-form" class="dir-form" autocomplete="off">
          <div class="field-row">
            <input id="dir-path" type="text" placeholder="或输入本机目录路径进行批量索引" />
            <button type="submit" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>
              索引目录
            </button>
          </div>
        </form>
        <div class="progress" id="import-progress" aria-live="polite"></div>
      </div>

      <div class="panel" id="panel-manage" role="tabpanel" hidden>
        <div class="panel-head">
          <h2>已索引文档</h2>
          <p>查看文档元数据，或移除不再需要的文档及其索引。</p>
        </div>
        <div class="doc-list" id="doc-list" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
